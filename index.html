<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us Region Creator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background-color: #1a1a1a;
            border: 1px solid #fff;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 1px solid #fff;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 8px;
            background-color: #000;
            border: 1px solid #fff;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background-color: #fff;
            border: none;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #ccc;
        }
        
        #output {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #fff;
            font-size: 12px;
            display: none;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
        }
        
        #output.success {
            border-color: #fff;
            color: #fff;
        }
        
        #output.error {
            border-color: #ff0000;
            color: #ff0000;
        }
        
        .status {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Among Us Region Creator</h1>
        
        <div class="form-group">
            <label for="regionName">Region Name:</label>
            <input type="text" id="regionName" value="EU">
        </div>
        
        <div class="form-group">
            <label for="ipAddress">IP Address:</label>
            <input type="text" id="ipAddress" value="127.0.0.1">
        </div>
        
        <div class="form-group">
            <label for="port">Port:</label>
            <input type="number" id="port" value="22023">
        </div>
        
        <div class="form-group">
            <label for="fileName">File Name:</label>
            <input type="text" id="fileName" value="regionInfo.dat">
        </div>
        
        <button onclick="createFile()">Create File</button>
        
        <div id="output"></div>
        <div class="status" id="status">Ready</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
